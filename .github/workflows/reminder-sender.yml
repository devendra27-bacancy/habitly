name: Reminder Sender

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending notifications or writing dispatch markers"
        required: false
        default: true
        type: boolean
      user_id:
        description: "Optional Firestore user id to target"
        required: false
        type: string
      at:
        description: "Optional ISO timestamp to simulate, for example 2026-03-13T08:00:00.000Z"
        required: false
        type: string

concurrency:
  group: reminder-sender
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize Firebase credentials
        shell: bash
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Run reminder sender
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              args+=("--dry-run")
            fi
            if [[ -n "${{ inputs.user_id }}" ]]; then
              args+=("--user-id=${{ inputs.user_id }}")
            fi
            if [[ -n "${{ inputs.at }}" ]]; then
              args+=("--at=${{ inputs.at }}")
            fi
          fi
          node scripts/reminder-runner.js "${args[@]}"
